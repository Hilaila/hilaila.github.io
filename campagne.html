<style>
  :root {
    --bg:#000008; --gold:#C9A84C; --gold-2:#E8C872; --gold-3:#8B6914;

  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {

      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(201,168,76,.08), transparent 70%);

  a { color:var(--gold-2); text-decoration:none; }
  .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
  .hide { display:none !important; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; max-width:1000px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--text); min-width:0; }
  .brand img { width:40px; height:40px; border-radius:50%; object-fit:cover; border:1.5px solid var(--gold); box-shadow:0 0 18px rgba(201,168,76,.25); flex-shrink:0; }
  .brand b { display:block; font-family:'Playfair Display', Georgia, serif; font-size:17px; color:var(--gold-2); font-weight:700; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand span { min-width:0; }
  .brand small { display:block; font-size:10px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; }
  .sub { display:flex; align-items:center; gap:8px; padding:2px 16px 10px; max-width:1000px; margin:0 auto; }
  .lang { display:flex; align-items:center; flex-shrink:0; gap:2px; padding:3px; border:1.5px solid var(--gold-2); border-radius:999px; background:rgba(232,200,114,.10); box-shadow:0 0 14px rgba(232,200,114,.35); }
  .lang .globe { display:grid; place-items:center; width:24px; color:var(--gold-2); padding-left:3px; }
  .lang .globe svg { width:17px; height:17px; }
  .lang button { border:0; border-radius:999px; background:transparent; color:#D9CFB4; font:700 12.5px 'JetBrains Mono', monospace; letter-spacing:.06em; padding:6px 10px; min-width:38px; cursor:pointer; }
  .lang button.on { background:linear-gradient(120deg, #F4E7C1, var(--gold-2)); color:#000008; box-shadow:0 0 10px rgba(232,200,114,.5); }
  .msep { flex-shrink:0; width:1px; align-self:stretch; margin:4px 2px; background:linear-gradient(180deg, transparent, rgba(232,200,114,.6), transparent); }
  .sub a { font-size:13.5px; color:var(--text); padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--glass); white-space:nowrap; }

  .ticker { overflow:hidden; border-bottom:1px solid var(--line); background:rgba(201,168,76,.03); }
  .ticker div { display:inline-block; white-space:nowrap; padding:8px 0; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--gold); letter-spacing:.08em; animation:defile 34s linear infinite; }
  .ticker span { color:var(--green); }
  @keyframes defile { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  main { max-width:1000px; margin:0 auto; padding:18px 16px 0; }
  .hero { position:relative; overflow:hidden; padding:24px 20px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(135deg, rgba(201,168,76,.12), rgba(123,92,214,.08) 60%, rgba(255,255,255,.02)); margin-bottom:16px; }

  .hero h1 { position:relative; z-index:1; margin-top:14px; font-family:'Playfair Display', Georgia, serif; font-size:clamp(30px, 8vw, 46px); line-height:1.05; font-weight:800; }
  .hero h1 em { font-style:normal; background:linear-gradient(100deg, #A87A14 0%, #F6D978 28%, #FFF5CF 42%, #E2B33A 58%, #B8871A 100%); background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:brille 4s linear infinite; }

  .hero .vf { font:500 12px 'JetBrains Mono', monospace; letter-spacing:.04em; color:var(--gold-2); }

  .glass h2 { font-family:'Playfair Display', Georgia, serif; font-size:21px; color:var(--gold-2); line-height:1.2; }
  .glass .hs { font-size:12.5px; color:var(--muted); margin-top:2px; }

  .film { margin-bottom:0; }

  .film video { display:block; width:100%; height:100%; object-fit:cover; background:#05050a; }
  .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:var(--glass); color:var(--text); font:700 14px 'Space Grotesk', system-ui, sans-serif; cursor:pointer; text-align:center; }
  .btn-gold { border:0; background:linear-gradient(120deg, #F4E7C1, var(--gold-2) 45%, var(--gold)); color:#000008; box-shadow:0 0 22px rgba(201,168,76,.35); }

  .safe h2 { color:#FFC4C4; }
  .safe p { margin-top:6px; color:var(--text); }
  .note { font-size:13px; color:var(--muted); }
  .credits { margin-top:8px; font:500 11.5px/1.6 'JetBrains Mono', monospace; color:#8C8577; }

  footer { max-width:1000px; margin:10px auto 0; padding:18px 16px 30px; text-align:center; font:500 11px 'JetBrains Mono', monospace; letter-spacing:.12em; color:var(--muted); }

<script>
const $ = id => document.getElementById(id);
function toast(msg) {
  const b = $("toast"); b.textContent = msg; b.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => { b.style.display = "none"; }, 2600);
}
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = $("copyBox"); ta.classList.remove("hide"); ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.classList.add("hide"); return ok;
  } catch (e) { return false; }
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll(".lang button").forEach(b => { const on = b.getAttribute("data-l") === LANG; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  const g = document.querySelector(".lang"); if (g) g.setAttribute("aria-label", t("lang"));
  $("msg").value = t("msg");
  // vidéos et téléchargements dans la langue choisie
  document.querySelectorAll("video[data-fr]").forEach(v => {
    const src = v.getAttribute("data-" + LANG), poster = v.getAttribute("data-poster-" + LANG);
    if (v.getAttribute("src") !== src) { v.pause(); v.setAttribute("poster", poster); v.setAttribute("src", src); v.load(); }
  });
  document.querySelectorAll("a[data-fr]").forEach(a => { a.setAttribute("href", a.getAttribute("data-" + LANG)); a.setAttribute("download", a.getAttribute("data-dl-" + LANG)); });
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  LANG = b.getAttribute("data-l");
  try { localStorage.setItem("gtcLang", LANG); } catch (e) {}
  applyLang();
}));
$("linkBtn").addEventListener("click", async () => { toast(await copyText(PAGE) ? t("copied") : t("copy_fail")); });
$("msgBtn").addEventListener("click", async () => {
  if (await copyText(t("msg"))) toast(t("msg_copied"));
  else { const m = $("msg"); m.focus(); m.select(); toast(t("copy_fail")); }
});
$("shareBtn").addEventListener("click", async () => {
  if (navigator.share) {
    try { await navigator.share({ title: t("title"), text: t("msg"), url: PAGE }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  toast(await copyText(t("msg")) ? t("msg_copied") : t("copy_fail"));
});
// une seule vidéo à la fois
document.querySelectorAll("video").forEach(v => v.addEventListener("play", () => {
  document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); });
}));
applyLang();
</script>
</body>
</html>
