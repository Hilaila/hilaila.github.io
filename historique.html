<style>
  :root {
    --bg:#000008; --gold:#C9A84C; --gold-2:#E8C872; --gold-3:#8B6914;
    --text:#E8E2D4; --muted:#9A9384; --line:rgba(201,168,76,.18);
    --glass:rgba(255,255,255,.035); --green:#3DDC97; --violet:#7B5CD6; --violet-2:#A88BFF; --blue:#5AA7FF; --red:#FF8D8D;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:#000008; }
  body {
    background:var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; line-height:1.6; font-size:15px; min-height:100vh;
    background-image:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(201,168,76,.14), transparent 70%),
      radial-gradient(ellipse 50% 35% at 100% 25%, rgba(123,92,214,.16), transparent 70%),
      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(201,168,76,.08), transparent 70%);
    background-attachment:fixed;
  }
  a { color:var(--gold-2); text-decoration:none; }
  .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
  .hide { display:none !important; }

  /* Barre du haut */
  .top { position:sticky; top:0; z-index:20; background:rgba(0,0,8,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--line); }
  .top::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; max-width:1000px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--text); min-width:0; }
  .brand img { width:40px; height:40px; border-radius:50%; object-fit:cover; border:1.5px solid var(--gold); box-shadow:0 0 18px rgba(201,168,76,.25); flex-shrink:0; }
  .brand b { display:block; font-family:'Playfair Display', Georgia, serif; font-size:17px; color:var(--gold-2); font-weight:700; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand span { min-width:0; }
  .brand small { display:block; font-size:10px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; }
  .adm { flex-shrink:0; font:700 11px 'JetBrains Mono', monospace; letter-spacing:.14em; color:var(--violet-2); border:1px solid rgba(168,139,255,.45); background:rgba(123,92,214,.14); border-radius:999px; padding:7px 12px; box-shadow:0 0 18px rgba(123,92,214,.25); }
  .sub { display:flex; align-items:center; gap:8px; padding:2px 16px 10px; max-width:1000px; margin:0 auto; }
  .lang { display:flex; align-items:center; flex-shrink:0; gap:2px; padding:3px; border:1.5px solid var(--gold-2); border-radius:999px; background:rgba(232,200,114,.10); box-shadow:0 0 14px rgba(232,200,114,.35); }
  .lang .globe { display:grid; place-items:center; width:24px; color:var(--gold-2); padding-left:3px; }
  .lang .globe svg { width:17px; height:17px; }
  .lang button { border:0; border-radius:999px; background:transparent; color:#D9CFB4; font:700 12.5px 'JetBrains Mono', monospace; letter-spacing:.06em; padding:6px 10px; min-width:38px; cursor:pointer; }
  .lang button.on { background:linear-gradient(120deg, #F4E7C1, var(--gold-2)); color:#000008; box-shadow:0 0 10px rgba(232,200,114,.5); }
  .msep { flex-shrink:0; width:1px; align-self:stretch; margin:4px 2px; background:linear-gradient(180deg, transparent, rgba(232,200,114,.6), transparent); }
  .sub a { font-size:13.5px; color:var(--text); padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--glass); white-space:nowrap; }

  .ticker { overflow:hidden; border-bottom:1px solid var(--line); background:rgba(201,168,76,.03); }
  .ticker div { display:inline-block; white-space:nowrap; padding:8px 0; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--gold); letter-spacing:.08em; animation:defile 34s linear infinite; }
  .ticker span { color:var(--green); }
  @keyframes defile { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  main { max-width:1000px; margin:0 auto; padding:18px 16px 0; }
  .demo { margin-bottom:14px; padding:10px 14px; border-radius:14px; border:1px dashed rgba(168,139,255,.55); background:rgba(123,92,214,.10); color:#D9CCFF; font:600 11.5px 'JetBrains Mono', monospace; letter-spacing:.04em; text-align:center; }

  /* Héros */
  .hero { position:relative; overflow:hidden; padding:24px 20px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(135deg, rgba(201,168,76,.12), rgba(123,92,214,.08) 60%, rgba(255,255,255,.02)); margin-bottom:16px; }
  .hero::after { content:""; position:absolute; width:260px; height:260px; right:-110px; top:-120px; border-radius:50%; background:radial-gradient(circle, rgba(232,200,114,.22), transparent 65%); }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; font:500 11px 'JetBrains Mono', monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-2); border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:rgba(0,0,8,.4); }
  .eyebrow i { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .hero h1 { position:relative; z-index:1; margin-top:14px; font-family:'Playfair Display', Georgia, serif; font-size:clamp(30px, 8vw, 46px); line-height:1.05; font-weight:800; }
  .hero h1 em { font-style:normal; background:linear-gradient(100deg, #A87A14 0%, #F6D978 28%, #FFF5CF 42%, #E2B33A 58%, #B8871A 100%); background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:brille 4s linear infinite; }
  @keyframes brille { from { background-position:100% 0; } to { background-position:-160% 0; } }
  .hero p { position:relative; z-index:1; margin-top:10px; color:var(--muted); font-size:14.5px; max-width:620px; }

  .glass { position:relative; border:1px solid var(--line); border-radius:20px; background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); padding:18px; margin-bottom:14px; }
  .glass h2 { font-family:'Playfair Display', Georgia, serif; font-size:21px; color:var(--gold-2); line-height:1.2; }
  .glass .hs { font-size:12px; color:var(--muted); margin-top:2px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:var(--glass); color:var(--text); font:700 14px 'Space Grotesk', system-ui, sans-serif; cursor:pointer; }
  .btn-gold { border:0; background:linear-gradient(120deg, #F4E7C1, var(--gold-2) 45%, var(--gold)); color:#000008; box-shadow:0 0 22px rgba(201,168,76,.35); }
  .btn:disabled { opacity:.6; cursor:default; }

  /* Connexion */
  #login { text-align:center; padding:30px 20px; }
  #login .pi { width:76px; height:76px; margin:0 auto 14px; display:grid; place-items:center; font:800 40px 'Space Grotesk', sans-serif; color:#000008; clip-path:polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background:linear-gradient(135deg, #FFF3C4, var(--gold-2) 40%, var(--gold-3)); filter:drop-shadow(0 0 16px rgba(232,200,114,.5)); }
  #login h2 { margin-bottom:6px; }
  #login p { color:var(--muted); font-size:13.5px; max-width:460px; margin:0 auto 18px; }
  #msg { margin-top:12px; min-height:18px; font-size:13px; color:var(--red); }

  /* Objectif */
  .goal { display:flex; align-items:center; gap:18px; }
  .ring { position:relative; width:118px; height:118px; flex-shrink:0; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .num b { font:700 34px 'JetBrains Mono', monospace; color:var(--gold-2); line-height:1; }
  .ring .num small { font:500 12px 'JetBrains Mono', monospace; color:var(--muted); }
  .slots { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin-top:12px; }
  .slots i { height:26px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03); display:grid; place-items:center; font:700 11px 'JetBrains Mono', monospace; font-style:normal; color:#5c574c; }
  .slots i.min { border-color:rgba(201,168,76,.35); }
  .slots i.on { background:linear-gradient(135deg, rgba(232,200,114,.95), rgba(201,168,76,.85)); color:#000008; border-color:transparent; box-shadow:0 0 12px rgba(232,200,114,.45); }
  .goal-txt b { display:block; font-size:16px; }
  .goal-txt small { display:block; color:var(--muted); font-size:12px; margin-top:4px; }

  /* Compteurs */
  .kpis { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin-bottom:14px; }
  .kpi { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:16px; padding:14px; background:var(--glass); }
  .kpi::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, transparent, var(--gold-2), transparent); opacity:.7; }
  .kpi small { display:block; font:500 10px 'JetBrains Mono', monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .kpi b { display:block; margin-top:6px; font:700 24px 'JetBrains Mono', monospace; color:var(--text); }
  .kpi.g b { color:var(--green); } .kpi.v b { color:var(--violet-2); } .kpi.o b { color:var(--gold-2); }

  /* Pioneers */
  .pios { display:grid; gap:10px; }
  .pio { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid rgba(255,255,255,.07); border-radius:16px; background:rgba(0,0,8,.35); }
  .hex { width:42px; height:42px; flex-shrink:0; display:grid; place-items:center; font:700 17px 'Space Grotesk', sans-serif; color:#000008; clip-path:polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background:linear-gradient(135deg, #FFF3C4, var(--gold-2) 45%, var(--gold-3)); }
  .hex.adm2 { background:linear-gradient(135deg, #E6DCFF, var(--violet-2) 45%, var(--violet)); }
  .who { flex:1; min-width:0; }
  .who b { display:flex; align-items:center; gap:6px; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .who b em { font:700 9.5px 'JetBrains Mono', monospace; font-style:normal; letter-spacing:.1em; color:var(--violet-2); border:1px solid rgba(168,139,255,.45); border-radius:999px; padding:1px 7px; }
  .who small { display:block; font-size:11px; color:var(--muted); }
  .chain { display:flex; align-items:center; flex-shrink:0; }
  .chain span { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:11.5px; color:#4f4b42; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03); }
  .chain s { width:7px; height:2px; background:rgba(255,255,255,.1); }
  .chain span.on { color:#000008; border-color:transparent; background:linear-gradient(135deg, #B9F5D8, var(--green)); box-shadow:0 0 10px rgba(61,220,151,.45); }
  .chain s.on { background:var(--green); box-shadow:0 0 6px rgba(61,220,151,.6); }

  /* Chronologie */
  .search { width:100%; min-height:44px; border-radius:999px; border:1px solid var(--line); background:rgba(0,0,8,.5); color:var(--text); padding:0 16px; font:14px 'Space Grotesk', sans-serif; outline:none; margin-bottom:10px; }
  .search:focus { border-color:var(--gold-2); box-shadow:0 0 0 3px rgba(232,200,114,.12); }
  .filters { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin-bottom:6px; padding-bottom:2px; }
  .filters::-webkit-scrollbar { display:none; }
  .filters button { flex-shrink:0; border:1px solid var(--line); background:var(--glass); color:var(--text); border-radius:999px; padding:7px 13px; font:600 13px 'Space Grotesk', sans-serif; cursor:pointer; }
  .filters button.on { color:#000008; background:var(--gold-2); border-color:var(--gold-2); }
  .day { margin:16px 0 6px; font:500 11px 'JetBrains Mono', monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-2); }
  .tl { position:relative; padding-left:24px; }
  .tl::before { content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg, rgba(232,200,114,.5), rgba(123,92,214,.35)); border-radius:2px; }
  .ev { position:relative; padding:9px 0 13px; }
  .ev::before { content:""; position:absolute; left:-21px; top:15px; width:12px; height:12px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px rgba(0,0,8,1), 0 0 12px var(--c); }
  .ev.connexion, .ev.identite { --c:var(--blue); } .ev.demande { --c:var(--gold-2); } .ev.paiement { --c:var(--green); } .ev.jeton { --c:var(--violet-2); }
  .ev .l1 { display:flex; justify-content:space-between; gap:10px; }
  .ev .l1 b { font-size:14.5px; }
  .ev .l1 b span { color:var(--c); }
  .ev .l1 time { font:500 12px 'JetBrains Mono', monospace; color:var(--muted); white-space:nowrap; }
  .ev .l2 { font-size:12.5px; color:#BDB6A3; margin-top:1px; }
  .ev .l2 em { font-style:normal; font-size:10.5px; color:var(--violet-2); border:1px solid rgba(168,139,255,.4); border-radius:999px; padding:0 7px; margin-left:4px; }
  .hash { display:flex; gap:8px; align-items:flex-start; margin-top:6px; padding:8px 10px; border-radius:10px; background:rgba(0,0,8,.55); border:1px solid rgba(255,255,255,.06); }
  .hash code { flex:1; min-width:0; font:400 11px 'JetBrains Mono', monospace; color:#A9A290; overflow-wrap:anywhere; word-break:break-all; }
  .hash code b { color:var(--muted); font-weight:500; }
  .hash button { flex-shrink:0; border:1px solid var(--line); background:transparent; color:var(--gold-2); border-radius:999px; font:600 10.5px 'Space Grotesk', sans-serif; padding:3px 9px; cursor:pointer; }
  .hash a { color:var(--gold-2); }
  .empty { text-align:center; color:var(--muted); font-size:13px; padding:14px; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .actions small { color:var(--muted); font:500 11px 'JetBrains Mono', monospace; margin-left:auto; }

  .diag { border-color:rgba(168,139,255,.35); background:linear-gradient(160deg, rgba(123,92,214,.10), rgba(255,255,255,.015)); }
  .diag h2 { color:var(--violet-2); }
  .diag ul { list-style:none; display:grid; gap:8px; }
  .diag li { display:flex; justify-content:space-between; gap:12px; padding:9px 12px; border-radius:12px; background:rgba(0,0,8,.45); border:1px solid rgba(255,255,255,.06); font-size:13px; }
  .diag li b { font-weight:600; color:var(--text); }
  .diag li span { font-family:'JetBrains Mono', monospace; font-size:12px; text-align:right; color:#BDB6A3; overflow-wrap:anywhere; }
  .diag li span.ok { color:var(--green); } .diag li span.ko { color:var(--red); }
  footer { max-width:1000px; margin:36px auto 0; padding:24px 16px 44px; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:12.5px; }
  footer img { width:48px; height:48px; margin:0 auto 10px; border-radius:50%; }
  footer .sig { font-family:'JetBrains Mono', monospace; letter-spacing:.18em; font-size:10.5px; color:var(--gold-3); text-transform:uppercase; margin-top:8px; }

  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:50; max-width:90%; padding:11px 16px; border-radius:12px; background:#14121c; border:1px solid var(--line); color:var(--text); font-size:13.5px; display:none; }

  @media (max-width:520px) {
    .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .brand small { display:none; } .brand b { font-size:15px; }
    .chain span { width:21px; height:21px; font-size:10.5px; } .chain s { width:5px; }
    .ring { width:104px; height:104px; } .ring .num b { font-size:30px; }
  }
  @media (prefers-reduced-motion: reduce) { .ticker div, .hero h1 em, .eyebrow i { animation:none; } }
</style>

<div id="toast" role="status"></div>

<script>
const CONFIG = { API_BASE_URL: "https://geoterrachain-qfs-vercel.vercel.app", TIMEOUT_MS: 25000, GOAL_MIN: 5, GOAL_IDEAL: 8 };
const ICON = { connexion: "π", identite: "π", demande: "◈", paiement: "✓", jeton: "⬡" };
const $ = id => document.getElementById(id);
const state = { events: [], admins: [], diag: null, filter: "", q: "", token: null, loadedAt: null };

const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
const loc = () => (LANG === "en" ? "en-GB" : "fr-FR");
const TZ = { timeZone: "Africa/Abidjan" };
const fmtDay = d => d.toLocaleDateString(loc(), { weekday: "long", day: "numeric", month: "long", ...TZ });
const fmtTime = d => d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit", ...TZ });
const fmtShort = d => d.toLocaleString(loc(), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", ...TZ });
const fmtNum = (n, max = 6) => Number(n).toLocaleString(loc(), { maximumFractionDigits: max });

function toast(msg) {
  const box = $("toast"); box.textContent = msg; box.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => { box.style.display = "none"; }, 3500);
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
  document.querySelectorAll(".lang button").forEach(b => { const on = b.getAttribute("data-l") === LANG; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  const g = document.querySelector(".lang"); if (g) g.setAttribute("aria-label", t("lang"));
  if (!$("dash").classList.contains("hide")) render();
}

async function postJSON(path, body) {
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  let slow = false;
  const timer = setTimeout(() => { slow = true; if (ctrl) ctrl.abort(); }, CONFIG.TIMEOUT_MS);
  try {
    const r = await fetch(CONFIG.API_BASE_URL + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined });
    const text = await r.text(); let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { error: t("e_bad", { c: r.status }) }; }
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    throw new Error(slow ? t("e_slow") : t("e_net"));
  } finally { clearTimeout(timer); }
}

async function login() {
  const btn = $("loginBtn"), msg = $("msg");
  msg.textContent = "";
  if (typeof window.Pi === "undefined") { msg.textContent = t("e_browser"); return; }
  btn.disabled = true; btn.textContent = t("login_wait");
  try {
    try { Pi.init({ version: "2.0" }); } catch (e) {}
    const auth = await Pi.authenticate(["username"], () => {});
    state.token = auth.accessToken;
    await load();
  } catch (e) {
    msg.textContent = e.message || t("e_denied");
  } finally { btn.disabled = false; btn.textContent = t("login_btn"); }
}

async function load() {
  const { ok, status, data } = await postJSON("/api/pi-auth", { action: "journal", accessToken: state.token });
  if (!ok) {
    const err = String(data.error || "");
    if (status === 403) throw new Error(t("e_denied"));
    if (err === "SUPABASE_NOT_CONFIGURED") throw new Error(t("e_db"));
    if (err.indexOf("AUDIT_READ_FAILED") === 0) throw new Error(t("e_table"));
    throw new Error(err || t("e_bad", { c: status }));
  }
  setData(data.events || [], data.admins || [], data.diag || null);
}

function setData(events, admins, diag) {
  state.diag = diag || null;
  state.events = events.map(e => ({ ...e, at: new Date(e.created_at) })).sort((a, b) => b.at - a.at);
  state.admins = admins.map(a => String(a).toLowerCase());
  state.loadedAt = new Date();
  $("login").classList.add("hide");
  $("dash").classList.remove("hide");
  render();
}

function users() {
  const map = new Map();
  [...state.events].sort((a, b) => a.at - b.at).forEach(e => {
    if (!map.has(e.username)) map.set(e.username, { username: e.username, first: e.at, last: e.at, types: new Set() });
    const u = map.get(e.username); u.last = e.at; u.types.add(e.type === "identite" ? "connexion" : e.type);
  });
  return [...map.values()].sort((a, b) => b.last - a.last);
}

function render() {
  const ev = state.events, all = users();
  const isAdmin = u => state.admins.includes(String(u).toLowerCase());
  const n = all.filter(u => !isAdmin(u.username)).length;

  // Objectif
  $("gNum").textContent = n;
  $("ringArc").setAttribute("stroke-dashoffset", (314.16 * (1 - Math.min(1, n / CONFIG.GOAL_MIN))).toFixed(2));
  $("gTxt").textContent = n >= CONFIG.GOAL_IDEAL ? t("goal_ok")
    : n >= CONFIG.GOAL_MIN ? t("goal_min", { n: CONFIG.GOAL_IDEAL - n })
    : (CONFIG.GOAL_MIN - n === 1 ? t("goal_left1") : t("goal_leftN", { n: CONFIG.GOAL_MIN - n }));
  $("slots").innerHTML = Array.from({ length: CONFIG.GOAL_IDEAL }, (_, i) => `<i class="${i < CONFIG.GOAL_MIN ? "min" : ""} ${i < n ? "on" : ""}">${i + 1}</i>`).join("");

  // Compteurs
  const count = (...ts) => ev.filter(e => ts.includes(e.type)).length;
  $("kUsers").textContent = n;
  $("kCnx").textContent = count("connexion", "identite");
  $("kReq").textContent = count("demande");
  $("kPay").textContent = count("paiement");
  $("kTok").textContent = count("jeton");
  $("kPi").textContent = fmtNum(ev.filter(e => e.type === "paiement").reduce((s, e) => s + (Number(e.amount) || 0), 0)) + " π";

  // Pioneers
  const steps = ["connexion", "demande", "paiement", "jeton"];
  $("pioneers").innerHTML = all.length ? all.map(u => {
    const chain = steps.map((s, i) => `${i ? `<s class="${u.types.has(s) && u.types.has(steps[i - 1]) ? "on" : ""}"></s>` : ""}<span class="${u.types.has(s) ? "on" : ""}" title="${esc(t("t_" + s))}">${ICON[s]}</span>`).join("");
    return `<div class="pio"><div class="hex ${isAdmin(u.username) ? "adm2" : ""}">${esc(u.username.slice(0, 1).toUpperCase())}</div>
      <div class="who"><b>@${esc(u.username)}${isAdmin(u.username) ? "<em>ADMIN</em>" : ""}</b>
      <small>${t("first")} ${fmtShort(u.first)} · ${t("last")} ${fmtShort(u.last)}</small></div>
      <div class="chain">${chain}</div></div>`;
  }).join("") : `<div class="empty">${t("none")}</div>`;

  // Chronologie
  const q = state.q.trim().toLowerCase().replace(/^@/, "");
  const list = ev.filter(e => (!state.filter || e.type === state.filter || (state.filter === "connexion" && e.type === "identite")) &&
    (!q || String(e.username).toLowerCase().includes(q) || String(e.reference || "").toLowerCase().includes(q)));
  $("count").textContent = t(list.length > 1 ? "evN" : "ev1", { n: list.length });
  let html = "", day = "";
  list.forEach(e => {
    const d = fmtDay(e.at);
    if (d !== day) { html += `${day ? "</div>" : ""}<div class="day">${esc(d)}</div><div class="tl">`; day = d; }
    const parts = [];
    if (e.page) parts.push(e.page === "index" ? t("p_index") : t("p_page", { p: esc(e.page) }));
    if (e.reference) parts.push(`<span class="mono">${esc(e.reference)}</span>`);
    if (e.amount != null && e.type === "paiement") parts.push(fmtNum(e.amount) + " π");
    if (e.amount != null && e.type === "demande") parts.push(t("targeted", { n: fmtNum(e.amount, 0) }));
    let hash = "";
    if (e.txid) hash += `<div class="hash"><code><b>${t("txid")}</b> ${esc(e.txid)}</code><button type="button" data-copy="${esc(e.txid)}">${t("copy")}</button></div>`;
    if (e.stellar_tx) hash += `<div class="hash"><code><b>${t("stx")}</b> <a href="https://stellar.expert/explorer/testnet/tx/${encodeURIComponent(e.stellar_tx)}" target="_blank" rel="noopener">${esc(e.stellar_tx)}</a></code><button type="button" data-copy="${esc(e.stellar_tx)}">${t("copy")}</button></div>`;
    html += `<div class="ev ${esc(e.type)}"><div class="l1"><b>@${esc(e.username)} · <span>${esc(t("t_" + e.type))}</span></b><time>${fmtTime(e.at)}</time></div>
      <div class="l2">${parts.join(" · ")}${e.manual ? `<em>${t("manual")}</em>` : ""}</div>${hash}</div>`;
  });
  $("timeline").innerHTML = html ? html + "</div>" : `<div class="empty">${t("empty_f")}</div>`;
  $("updated").textContent = state.loadedAt ? t("updated", { h: fmtTime(state.loadedAt) }) : "";
  renderDiag();
}

function renderDiag() {
  const d = state.diag, card = $("diagCard");
  if (!d) { card.classList.add("hide"); return; }
  const keyOk = ["service_role", "secret"].includes(d.key);
  const tableTxt = x => !x ? "—" : (x.ok ? t("diag_rows", { n: x.count }) : "✗ " + esc(x.error || ""));
  const rows = [
    [t("diag_audit"), tableTxt(d.audit), d.audit && d.audit.ok],
    [t("diag_pay"), tableTxt(d.paiements), d.paiements && d.paiements.ok],
    [t("diag_users"), tableTxt(d.users), d.users && d.users.ok],
    [t("diag_key"), keyOk ? t("diag_key_ok") : t("diag_key_bad", { k: esc(d.key) }), keyOk]
  ];
  if (d.writeTest) rows.push([t("diag_write"), d.writeTest.ok ? t("diag_write_ok") : t("diag_write_bad", { e: esc(d.writeTest.error || "") }), d.writeTest.ok]);
  const problem = state.events.length === 0 || !keyOk || rows.some(r => r[2] === false);
  card.classList.toggle("hide", !problem);
  $("diagList").innerHTML = rows.map(r => `<li><b>${r[0]}</b><span class="${r[2] ? "ok" : "ko"}">${r[1]}</span></li>`).join("");
}

function exportCSV() {
  const rows = [["date", "heure", "username", "type", "page", "reference", "montant", "txid", "stellar_tx", "ajout_manuel"]];
  [...state.events].sort((a, b) => a.at - b.at).forEach(e => rows.push([
    e.at.toLocaleDateString("fr-FR", TZ), e.at.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", ...TZ }),
    e.username, e.type, e.page || "", e.reference || "", e.amount == null ? "" : e.amount, e.txid || "", e.stellar_tx || "", e.manual ? "oui" : ""]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "journal-geoterrachain-qfs.csv"; a.click();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  LANG = b.getAttribute("data-l");
  try { localStorage.setItem("gtcLang", LANG); } catch (e) {}
  applyLang();
}));
$("loginBtn").addEventListener("click", login);
$("refreshBtn").addEventListener("click", () => load().catch(e => toast(e.message)));
$("csvBtn").addEventListener("click", exportCSV);
$("search").addEventListener("input", e => { state.q = e.target.value; render(); });
$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.filter = b.dataset.f;
  [...$("filters").children].forEach(x => x.classList.toggle("on", x === b));
  render();
});
$("timeline").addEventListener("click", e => {
  const b = e.target.closest("button[data-copy]"); if (!b) return;
  const v = b.getAttribute("data-copy");
  const done = () => { b.textContent = t("copied"); setTimeout(() => { b.textContent = t("copy"); }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, done); else done();
});

applyLang();

/* Aperçu sans serveur : historique.html?demo=1 */
if (new URLSearchParams(location.search).get("demo") === "1") {
  $("demoBanner").classList.remove("hide");
  setData([
    { created_at: "2026-10-12T09:30:40Z", type: "identite", username: "phantok1", page: "tokenisation" },
    { created_at: "2026-10-12T09:32:10Z", type: "demande", username: "phantok1", page: "tokenisation", reference: "GTC-1791797530033-VKZS46", amount: 1000 },
    { created_at: "2026-10-12T09:33:05Z", type: "paiement", username: "phantok1", reference: "GTC-1791797530033-VKZS46", amount: 0.001, txid: "4b7178528a3676dd62b802aea53b9c0a8c5a657c42e0dab7d6030d5b8563c6c0" },
    { created_at: "2026-10-12T09:33:20Z", type: "jeton", username: "phantok1", reference: "GTC-1791797530033-VKZS46", stellar_tx: "dfda42768f9b0f8e86411cf0efaeacbe8176015a53412ffef4f71dd4f71be9f2" },
    { created_at: "2026-10-12T14:05:00Z", type: "connexion", username: "Exemple_A", page: "index" },
